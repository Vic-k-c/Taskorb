databases:
  - name: church-canvass-db
    plan: free
    databaseName: church_canvass
    user: church_canvass

services:
  - type: web
    name: church-canvass
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm run migrate && npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: church-canvass-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production
      - key: GOOGLE_MAPS_API_KEY
        sync: false
      - key: GOOGLE_GEOCODING_API_KEY
        sync: false
      - key: PAYSTACK_MODE
        value: test
      - key: PAYSTACK_TEST_SECRET_KEY
        sync: false
      - key: PAYSTACK_TEST_PUBLIC_KEY
        sync: false
      - key: PAYSTACK_LIVE_SECRET_KEY
        sync: false
      - key: PAYSTACK_LIVE_PUBLIC_KEY
        sync: false
      - key: PAYSTACK_PLAN_INDIVIDUAL_MONTHLY
        sync: false
      - key: PAYSTACK_PLAN_INDIVIDUAL_ANNUAL
        sync: false
      - key: PAYSTACK_PLAN_TEAM_STARTER_MONTHLY
        sync: false
      - key: PAYSTACK_PLAN_TEAM_STARTER_ANNUAL
        sync: false
      - key: PAYSTACK_PLAN_TEAM_MONTHLY
        sync: false
      - key: PAYSTACK_PLAN_TEAM_ANNUAL
        sync: false
      - key: PAYSTACK_PLAN_TEAM_GROWTH_MONTHLY
        sync: false
      - key: PAYSTACK_PLAN_TEAM_GROWTH_ANNUAL
        sync: false
      - key: PAYSTACK_PLAN_TEAM_BUSINESS_MONTHLY
        sync: false
      - key: PAYSTACK_PLAN_TEAM_BUSINESS_ANNUAL
        sync: false
      - key: BILLING_GRACE_PERIOD_DAYS
        value: 7
